<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LexBuddy - Criar Conta</title>
    <!-- Estilização Injetada para o Painel de Cadastro -->
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f1f5f9; margin: 0; padding: 0; display: flex; height: 100vh; align-items: center; justify-content: center; }
        .card-register { background: #fff; padding: 40px; border-radius: 12px; border: 1px solid #e2e8f0; width: 100%; max-width: 400px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .card-register h3 { margin-top: 0; margin-bottom: 24px; font-size: 24px; font-weight: 700; text-align: center; color: #0f172a; }
        .form-group { margin-bottom: 20px; }
        .form-label { display: block; font-size: 13px; color: #64748b; font-weight: 600; margin-bottom: 6px; }
        .form-control { display: block; width: 100%; padding: 12px 14px; font-size: 14px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-family: inherit; }
        .btn-primary { display: block; width: 100%; padding: 12px; font-size: 14px; font-weight: 700; text-align: center; color: #fff; background-color: #2563eb; border-radius: 6px; cursor: pointer; border: none; box-sizing: border-box; transition: background 0.2s; }
        .btn-primary:hover { background-color: #1d4ed8; }
        .text-center { text-align: center; margin-top: 20px; }
        .text-center a { font-size: 14px; color: #2563eb; text-decoration: none; font-weight: 500; }
    </style>
</head>
<body>

    <div class="card-register">
        <h3>Cadastro de Jurista</h3>
        
        <form action="/registro" method="POST">
            <div class="form-group">
                <label class="form-label">Nome Completo</label>
                <input type="text" class="form-control" placeholder="Digite seu nome completo" required>
            </div>
            <div class="form-group">
                <label class="form-label">E-mail Profissional</label>
                <input type="email" class="form-control" placeholder="Ex: nome@adv.com" required>
            </div>
            <div class="form-group">
                <label class="form-label">Senha de Acesso</label>
                <input type="password" class="form-control" placeholder="Crie uma senha forte" required>
            </div>
            <button type="submit" class="btn-primary">Finalizar Cadastro</button>
        </form>
        
        <div class="text-center">
            <a href="/login">Já tem uma conta? Faça o login</a>
        </div>
    </div>

</body>
</html>
